name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    name: Python security (bandit, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stack32-agent-runtime
        run: pip install ../stack32-agent-runtime
      - run: pip install -e ".[dev]"
      - run: bandit -r agent_service -ll
      - run: pip-audit

  trivy-image:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build agent-service image
        run: docker build -f services/agent-service/Dockerfile -t stack32-agent-service:ci services
      # Pinned to the commit SHA of v0.35.0 — the only trivy-action tag confirmed
      # uncompromised in the March 2026 supply-chain incident (all non-v tags, incl.
      # the previous 0.28.0, were removed). SHA pinning per GitHub Actions best practice.
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: stack32-agent-service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
