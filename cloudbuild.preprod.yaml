# Cloud Build — agent-service → Cloud Run PREPROD.
# Tagged with $BUILD_ID, not $SHORT_SHA: manual `gcloud builds submit` runs have
# no source commit, so $SHORT_SHA expands to nothing and the tag is rejected.
# Same gates as production: nothing deploys unless the service's own tests pass.
# Build context MUST be services/ (Dockerfile copies stack32-agent-runtime + agent-service).
steps:
  - name: python:3.12-slim
    id: Verify
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --no-cache-dir ./services/stack32-agent-runtime
        pip install --quiet --no-cache-dir -e "./services/agent-service[dev]"
        cd services/agent-service
        ruff check .
        pytest -q
        bandit -r agent_service -ll

  - name: gcr.io/cloud-builders/docker
    id: Build
    waitFor: ["Verify"]
    args:
      - build
      - --platform=linux/amd64
      - -f
      - services/agent-service/Dockerfile
      - -t
      - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod-$BUILD_ID
      - -t
      - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod
      - services

  - name: gcr.io/cloud-builders/docker
    id: Push-sha
    args: [push, "europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod-$BUILD_ID"]

  - name: gcr.io/cloud-builders/docker
    id: Push-preprod
    args: [push, "europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - stack32-agent-api-preprod
      - --platform=managed
      - --image=europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod-$BUILD_ID
      - --region=europe-west1
      - --timeout=3600
      - --quiet

  # Builds are hour-long requests; sharing the API's instances let a handful
  # of builds starve every interactive call. The worker is the same image with
  # the same config, cloned from the live API service so secrets stay out of
  # the repo, with lower concurrency (5) because its requests are heavy. The
  # API then sends Cloud Tasks there instead of to itself.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy-worker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # The build SA cannot resolve the project via Resource Manager; name it.
        gcloud config set project stack32 --quiet
        gcloud run services describe stack32-agent-api-preprod \
          --region=europe-west1 --format=export > /tmp/worker.yaml
        sed -i \
          -e 's/name: stack32-agent-api-preprod/name: stack32-agent-worker-preprod/' \
          -e 's/containerConcurrency: 20/containerConcurrency: 5/' \
          -e 's#https://stack32-agent-api-preprod-732339494633.europe-west1.run.app/v1/internal/tasks/run#https://stack32-agent-worker-preprod-732339494633.europe-west1.run.app/v1/internal/tasks/run#' \
          /tmp/worker.yaml
        gcloud run services replace /tmp/worker.yaml --region=europe-west1 --project=stack32 --quiet
        gcloud run services add-iam-policy-binding stack32-agent-worker-preprod \
          --region=europe-west1 --project=stack32 \
          --member=serviceAccount:stack32-task-invoker@stack32.iam.gserviceaccount.com \
          --role=roles/run.invoker --quiet
        gcloud run services update stack32-agent-api-preprod \
          --region=europe-west1 --project=stack32 --quiet \
          --update-env-vars=CLOUD_TASKS_TARGET_URL=https://stack32-agent-worker-preprod-732339494633.europe-west1.run.app/v1/internal/tasks/run

images:
  - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod-$BUILD_ID
  - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
