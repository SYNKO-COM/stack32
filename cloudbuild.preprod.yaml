# Cloud Build — agent-service → Cloud Run PREPROD.
# Same gates as production: nothing deploys unless the service's own tests pass.
# Build context MUST be services/ (Dockerfile copies stack32-agent-runtime + agent-service).
steps:
  - name: python:3.12-slim
    id: Verify
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --no-cache-dir ./services/stack32-agent-runtime
        pip install --quiet --no-cache-dir -e "./services/agent-service[dev]"
        cd services/agent-service
        ruff check .
        pytest -q
        bandit -r agent_service -ll

  - name: gcr.io/cloud-builders/docker
    id: Build
    waitFor: ["Verify"]
    args:
      - build
      - --platform=linux/amd64
      - -f
      - services/agent-service/Dockerfile
      - -t
      - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod-$SHORT_SHA
      - -t
      - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod
      - services

  - name: gcr.io/cloud-builders/docker
    id: Push-sha
    args: [push, "europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod-$SHORT_SHA"]

  - name: gcr.io/cloud-builders/docker
    id: Push-preprod
    args: [push, "europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - stack32-agent-api-preprod
      - --platform=managed
      - --image=europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod-$SHORT_SHA
      - --region=europe-west1
      - --timeout=3600
      - --quiet

images:
  - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod-$SHORT_SHA
  - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:preprod

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
