# Cloud Build — agent-service → Cloud Run (GitHub trigger on main).
# Build context MUST be services/ (Dockerfile copies stack32-agent-runtime + agent-service).
steps:
  # Gate the deploy on the service's own tests. The GitHub Actions CI runs in a
  # separate system that this trigger never consults, so a red build used to
  # ship to production anyway — that is how a publish-breaking UnboundLocalError
  # (which ruff reports as F823) reached users. Fail here and nothing deploys.
  - name: python:3.12-slim
    id: Verify
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --no-cache-dir ./services/stack32-agent-runtime
        pip install --quiet --no-cache-dir -e "./services/agent-service[dev]"
        cd services/agent-service
        ruff check .
        pytest -q
        bandit -r agent_service -ll

  - name: gcr.io/cloud-builders/docker
    id: Build
    waitFor: ["Verify"]
    args:
      - build
      - --platform=linux/amd64
      - -f
      - services/agent-service/Dockerfile
      - -t
      - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:$COMMIT_SHA
      - -t
      - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:production
      - services

  - name: gcr.io/cloud-builders/docker
    id: Push-sha
    args:
      - push
      - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:$COMMIT_SHA

  - name: gcr.io/cloud-builders/docker
    id: Push-production
    args:
      - push
      - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:production

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - stack32-agent-api
      - --platform=managed
      - --image=europe-west1-docker.pkg.dev/stack32/stack32/agent-service:$COMMIT_SHA
      - --region=europe-west1
      # A coding build with repair iterations can exceed the 300s default. When
      # Cloud Run kills it, Cloud Tasks retries the same run up to 5 times and
      # the whole LLM build is paid for again.
      - --timeout=3600
      - --quiet

  # Builds are hour-long requests; sharing the API's instances lets a handful
  # of builds starve every interactive call. The worker is the same image with
  # the same config, cloned from the live API service so secrets stay out of
  # the repo, with lower concurrency (5) because its requests are heavy. The
  # API then sends Cloud Tasks there instead of to itself.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy-worker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # The build SA cannot resolve the project via Resource Manager; name it.
        gcloud config set project stack32 --quiet
        gcloud run services describe stack32-agent-api \
          --region=europe-west1 --format=export > /tmp/worker.yaml
        sed -i \
          -e 's/name: stack32-agent-api/name: stack32-agent-worker/' \
          -e 's/containerConcurrency: [0-9]*/containerConcurrency: 5/' \
          -e 's#https://stack32-agent-api-732339494633.europe-west1.run.app/v1/internal/tasks/run#https://stack32-agent-worker-732339494633.europe-west1.run.app/v1/internal/tasks/run#' \
          /tmp/worker.yaml
        gcloud run services replace /tmp/worker.yaml --region=europe-west1 --project=stack32 --quiet
        gcloud run services add-iam-policy-binding stack32-agent-worker \
          --region=europe-west1 --project=stack32 \
          --member=serviceAccount:stack32-task-invoker@stack32.iam.gserviceaccount.com \
          --role=roles/run.invoker --quiet
        gcloud run services update stack32-agent-api \
          --region=europe-west1 --project=stack32 --quiet \
          --update-env-vars=CLOUD_TASKS_TARGET_URL=https://stack32-agent-worker-732339494633.europe-west1.run.app/v1/internal/tasks/run

images:
  - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:$COMMIT_SHA
  - europe-west1-docker.pkg.dev/stack32/stack32/agent-service:production

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
