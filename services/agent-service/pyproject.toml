[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-service"
version = "0.3.0"
description = "Stack32 Agent Service - API backend for building and running AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "litellm>=1.50",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    # Arrives with the checkpointer anyway, but the runtime imports it directly
    # to pool those connections, so it is declared rather than assumed.
    "psycopg-pool>=3.2",
    "pipedream>=1.0",
    "stack32-agent-runtime",
    "cryptography>=43.0",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "google-cloud-tasks>=2.16",
]

[project.optional-dependencies]
sandbox = [
    "e2b>=1.0",
]
gcp = [
    "google-cloud-tasks>=2.16",
]
observability = [
    "sentry-sdk[fastapi]>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency/param helpers are intended as call-in-default sentinels.
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.Security",
]
