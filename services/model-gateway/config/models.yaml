# Stack32 model profiles — OpenAI-first platform defaults (Aug 2026).

profiles:
  fast:
    primary: openai/gpt-5.6-luna
    fallbacks:
      - openai/gpt-4.1-mini
    purpose: intent, identity, form utility
    reasoning: low

  balanced:
    primary: openai/gpt-5.6-terra
    fallbacks:
      - openai/gpt-5.6-sol
    purpose: builder chat, moderate spec generation
    reasoning: medium

  reasoning:
    primary: openai/gpt-5.6-terra
    fallbacks:
      - openai/gpt-5.6-sol
      - anthropic/claude-sonnet-5
    purpose: architecture, graph, heavy analysis
    reasoning: high

  coding:
    primary: openai/gpt-5.6-terra
    fallbacks:
      - openai/gpt-5.6-sol
      - anthropic/claude-sonnet-5
    expert: openai/gpt-5.6-sol
    external_expert: anthropic/claude-sonnet-5
    purpose: sandbox coding, inspect/patch/repair
    reasoning: medium-high

  validator:
    primary: openai/gpt-5.6-terra
    fallbacks:
      - openai/gpt-5.6-luna
    purpose: structured validation, diff review
    reasoning: medium

  embedding:
    primary: openai/text-embedding-3-small
    dimension: 1536

routing:
  intent_classification: fast
  identity: fast
  builder_chat: balanced
  spec_generation: balanced
  coding_patch: coding
  coding_repair: coding
  coding_expert: coding
  validation: validator
  embeddings: embedding

stage_policy:
  inspect: { model: terra, reasoning: medium }
  diagnose: { model: terra, reasoning: high }
  patch: { model: terra, reasoning: medium }
  repair_hard: { model: sol, reasoning: xhigh }
  repair_expert: { model: claude-sonnet-5, max_per_repair: 1 }

cost_defaults:
  conservative_unknown_usd_per_m: { input: 10, output: 30 }
  sonnet_reservation_usd_per_m: { input: 3, output: 15 }
  annual_monthly_ai_caps_usd: { starter: 5, pro: 10, scale: 20 }
