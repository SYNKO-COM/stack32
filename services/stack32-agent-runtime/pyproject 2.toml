[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stack32-agent-runtime"
version = "0.1.0"
description = "Stack32 shared agent runtime SDK: deterministic orchestrator, tool dispatch, context, memory, budgets, approvals, tracing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["stack32_agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
