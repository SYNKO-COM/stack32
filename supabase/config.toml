# Stack32 — Supabase CLI config (local + pushable to linked hosted project).

project_id = "stack32"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://stack32.com"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/confirmed",
  "http://localhost:3000/verify-email",
  "http://localhost:3000/reset-password",
  "https://stack32.com/auth/callback",
  "https://stack32.com/auth/confirm",
  "https://stack32.com/auth/confirmed",
  "https://stack32.com/verify-email",
  "https://stack32.com/reset-password",
  "https://www.stack32.com/auth/callback",
  "https://www.stack32.com/auth/confirm",
  "https://www.stack32.com/auth/confirmed",
  "https://www.stack32.com/verify-email",
  "https://www.stack32.com/reset-password",
  "https://stack32.vercel.app/auth/callback",
  "https://stack32.vercel.app/auth/confirm",
  "https://stack32.vercel.app/auth/confirmed",
  "https://stack32.vercel.app/verify-email",
  "https://stack32.vercel.app/reset-password",
]
# Match dashboard policy: min 10 + lower/upper/digits/symbols.
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits_symbols"

# Captcha: local/CI leave disabled. Hosted project enabled separately.
[auth.captcha]
enabled = false
provider = "hcaptcha"


[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
enable_confirmations = true
# Match dashboard: 6-digit OTP, 3600s (60 minutes) expiry.
otp_length = 6
otp_expiry = 3600
max_frequency = "1m0s"
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true

# Disabled locally: the analytics container needs to mount the Docker socket,
# which is not supported by colima on macOS.
[analytics]
enabled = false
