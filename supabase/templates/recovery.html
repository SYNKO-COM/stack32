<!doctype html>
<html>
<body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#161616;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#ffffff;width:100%;">
  <tr>
    <td align="center" style="padding:40px 16px;">

      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;">

        <tr>
          <td style="padding:0 0 22px 0;">
            <div style="font-size:24px;font-weight:800;letter-spacing:-0.8px;color:#151515;">
              STACK<span style="color:#fa720b;">32</span>
            </div>
          </td>
        </tr>

        <tr>
          <td style="height:4px;background:#fa720b;background-image:linear-gradient(90deg,#fcb802 0%,#fa720b 100%);border-radius:14px 14px 0 0;font-size:0;line-height:0;">
            &nbsp;
          </td>
        </tr>

        <tr>
          <td style="border:1px solid #e7e7e7;border-top:0;border-radius:0 0 14px 14px;padding:38px 36px;background:#ffffff;">

            <h1 style="margin:0 0 16px 0;font-size:28px;line-height:36px;color:#151515;font-weight:800;letter-spacing:-0.6px;">
              Reset your password
            </h1>

            <p style="margin:0;font-size:15px;line-height:24px;color:#686868;">
              We received a request to reset the password for your Stack32 account. This link is valid for 60 minutes.
            </p>

            <div style="margin:28px 0;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="border-radius:10px;background:#fa720b;background-image:linear-gradient(135deg,#fcb802 0%,#fa720b 100%);">
                    <a
                      href="{{ .ConfirmationURL }}"
                      style="display:inline-block;padding:14px 22px;font-size:14px;font-weight:800;color:#151515;text-decoration:none;border-radius:10px;"
                    >
                      Choose a new password
                    </a>
                  </td>
                </tr>
              </table>
            </div>

            <div style="padding:15px 16px;border-radius:10px;background:#fff8e8;border:1px solid #ffe2a8;font-size:12px;line-height:19px;color:#765c28;">
              <strong style="color:#5e471f;">Security notice:</strong>
              If you didn’t request a password reset, you can ignore this email.
            </div>

          </td>
        </tr>

        <tr>
          <td style="padding:20px 0;text-align:center;font-size:11px;line-height:18px;color:#aaaaaa;">
            Stack32 · Account security
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
